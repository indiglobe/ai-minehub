name: ai-minehub-prod-local

# the ports are derived from this, for consistent accross projects
# node -p "
# const c = require('crypto');
# const n = process.argv[1];
# const h = c.createHash('sha256').update(n).digest().readUInt32BE(0);
# 10000 + (h % 10000);
# " \
# container-name

networks:
  ai-minehub-prod-local:
    driver: bridge

services:
  ai-minehub-prod-local-database:
    container_name: ai-minehub-prod-local-database
    image: mysql:8.4
    environment:
      MYSQL_ROOT_USER: admin
      MYSQL_ROOT_PASSWORD: password
    ports:
      - 11220:3306
    networks:
      - ai-minehub-prod-local
    volumes:
      - database:/var/lib/mysql

  ai-minehub-prod-local-phpmyadmin:
    container_name: ai-minehub-prod-local-phpmyadmin
    image: phpmyadmin/phpmyadmin
    ports:
      - "15231:80"
    environment:
      PMA_HOST: ai-minehub-prod-local-database
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: password
    depends_on:
      - ai-minehub-prod-local-database
    networks:
      - ai-minehub-prod-local

  ai-minehub-prod-local-proxy:
    container_name: ai-minehub-prod-local-proxy
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ai-minehub-prod-local
    volumes:
      - ../nginx.secure.prod.local.conf:/etc/nginx/nginx.conf:ro
      - ../localhost-cert.pem:/etc/nginx/certs/localhost-cert.pem:ro
      - ../localhost-key.pem:/etc/nginx/certs/localhost-key.pem:ro

  ai-minehub-web-app:
    container_name: ai-minehub-web-app
    # pull_policy: "always"
    image: "nirvikpurkait/ai-minehub/web-app"
    env_file:
      - ../.env.production.local
    ports:
      - 15445:3000
    networks:
      - ai-minehub-prod-local

  ai-minehub-socket-app:
    container_name: ai-minehub-socket-app
    # pull_policy: "always"
    image: "nirvikpurkait/ai-minehub/socket-app"
    env_file:
      - ../.env.production.local
    ports:
      - 15728:3030
    networks:
      - ai-minehub-prod-local

volumes:
  database:
