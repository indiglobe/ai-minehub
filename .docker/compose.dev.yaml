name: ai-minehub-dev

networks:
  ai-minehub-dev:
    driver: bridge

services:
  ai-minehub-dev-database:
    container_name: ai-minehub-dev-database
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: password
    ports:
      - 14015:3306
    networks:
      - ai-minehub-dev
    volumes:
      - database:/var/lib/mysql
    restart: unless-stopped

  ai-minehub-dev-phpmyadmin:
    container_name: ai-minehub-dev-phpmyadmin
    image: phpmyadmin/phpmyadmin
    ports:
      - "17037:80"
    environment:
      PMA_HOST: ai-minehub-dev-database
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: password
    depends_on:
      - ai-minehub-dev-database
    networks:
      - ai-minehub-dev
    restart: unless-stopped

  ai-minehub-dev-proxy:
    container_name: ai-minehub-dev-proxy
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ai-minehub-dev
    volumes:
      - ../nginx.secure.dev.conf:/etc/nginx/nginx.conf:ro
      - ../localhost-cert.pem:/etc/nginx/certs/localhost-cert.pem:ro
      - ../localhost-key.pem:/etc/nginx/certs/localhost-key.pem:ro

  ai-minehub-dev-floci:
    container_name: ai-minehub-dev-floci
    image: floci/floci:nightly
    ports:
      - "17910:4566"
    volumes:
      - floci-data:/var/lib/floci
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - FLOCI_LOG_LEVEL=info
      - FLOCI_DATA_DIR=/var/lib/floci
    networks:
      - ai-minehub-dev
    restart: unless-stopped

volumes:
  database:
  floci-data:
